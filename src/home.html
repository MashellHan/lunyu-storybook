<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e4">
  <title>论语 · 绘本目录</title>
  <link rel="icon" href="__ICON__">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <main class="home" aria-labelledby="home-title">
    <div class="cover">
      <h1 id="home-title">论语</h1>
      <div class="scene" role="img" aria-label="大象老师、小兔、小猫和小狗围坐在一起">
        <div class="home-animal home-elephant" id="welcome-elephant"><img src="__ELEPHANT__" width="640" height="640" alt=""></div>
        <div class="home-animal home-bunny"><img src="__BUNNY_EAR__" width="640" height="640" alt=""><img src="__BUNNY_BASE__" width="640" height="640" alt=""></div>
        <div class="home-animal home-cat"><img src="__CAT__" width="640" height="640" alt=""></div>
        <div class="home-animal home-dog"><img src="__DOG_TAIL__" width="640" height="640" alt=""><img src="__DOG_BODY__" width="640" height="640" alt=""><img src="__DOG_HEAD__" width="640" height="640" alt=""></div>
      </div>
    </div>
    <nav class="catalog" aria-label="论语二十篇目录">
      <div class="catalog-decor" aria-hidden="true">
        <span class="bookmark bookmark-coral"></span>
        <span class="bookmark bookmark-sage"></span>
        <svg class="paper-plane" viewBox="0 0 40 26" focusable="false">
          <path class="plane-paper" d="M2 12 38 2 27 24 20 16 12 20 13 14Z"/>
          <path class="plane-fold" d="m13 14 25-12-18 14-8 4Z"/>
          <path class="plane-crease" d="m2 12 11 2L38 2 20 16l7 8M20 16l-8 4 1-6"/>
        </svg>
        <div class="peek peek-bunny"><div class="peek-art">
          <img src="__BUNNY_EAR__" width="640" height="640" alt="">
          <img src="__BUNNY_BASE__" width="640" height="640" alt="">
        </div></div>
        <div class="peek peek-cat"><div class="peek-art" id="welcome-cat">
          <img src="__CAT__" width="640" height="640" alt="">
        </div></div>
      </div>
      __CATALOG__
    </nav>
  </main>
  <script src="home.js"></script>
</body>
</html>
