<!doctype html>
<!--
  学而·第一章 互动绘本 Demo v6 (single file, double-click to open; no CDN, no library)

  v4 = v3 with ALL speech re-rendered via Azure Speech (eastus, Speech SDK, word-boundary timing):
      大象老师 zh-CN-YunzeNeural role=OlderAdultMale style=calm rate -15%
      小兔 zh-CN-XiaoyouNeural rate -12% · 小猫 zh-CN-YunxiaNeural style=cheerful rate -12%
      小狗 zh-CN-Yunxi:DragonHDFlashLatestNeural style=cheerful rate -15% + 100ms break after the first clause (paced to match the cat)
      齐读 = bunny+cat+dog mixed, 0/70/140 ms offsets (cat/dog time-stretched to the bunny's length)
      Polyphones: neural voices use <phoneme alphabet=sapi> 说 yue4 / 乐 le4 / 愠 yun4 / 论 lun2; HD voice uses <sub alias> 说→悦, 愠→运.
      v5: dog re-paced (-15%); animal sounds are real CC0 recordings (bunny honk-squeak, kitten meow, puppy yips, elephant trumpet);
      v6: elephant trumpet = freesound 527845 (D.jones, CC0), ~2 s with natural fade; all animal sounds ~5 dB below voice. Voices unchanged from v5.
      the elephant trumpets (~2 s) at the start, at the celebration and when tapped in free play. Credits: audio/CREDITS.md
  • Script: title screen (论语 之 学而时习之 + voice) -> ▶ -> 大象老师 reads each sentence, the three friends read it together
    -> "我们再来一遍吧" -> bunny s1 (+squeak), cat s2 (+meow), dog s3 (+woof, somersault) -> free play with tap rings.
  • Bottom sentence cards are the subtitles: karaoke highlight per character, timed from Azure word boundaries
    (characters inside one word are spread evenly over that word's duration).
  • Content rule (user): the only words are the title, the three original sentences (+pinyin), "我们再来一遍吧", animal sounds.
  • Pause button pauses audio, the script timeline and every animation. Reduced motion: fades/colour only.

  DELIBERATE DEVIATIONS (documented): hallmark playful allows spring only on the primary CTA + one character moment and
  impeccable animate.md puts focal motion at 500–800 ms; for a 3-year-old the user asked for bigger moves, so each animal keeps
  one 1.0–1.3 s character moment, plus a spring on the title letters (the opening is the single "hero" moment).
  Moments stay sequential (one focal moment at a time), never on UI state; idle stays subtle.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>论语 · 学而时习之</title>
<link rel="icon" href="__ICON__">
<link rel="apple-touch-icon" href="__ICON__">
<style>
:root{
  --cream:#fff6e4; --cream-2:#fbe9c8; --wood:#d9a66b; --wood-2:#b9814a; --ink:#4a3424; --ink-2:#7a5a42;
  --accent:#f08a5d; --leaf:#8cc084; --sky:#bfe3f2; --star:#ffc93c;
  --ease-out:cubic-bezier(0.16,1,0.3,1); --ease-in:cubic-bezier(0.7,0,0.84,0); --ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --dur-micro:120ms; --dur-short:220ms; --dur-long:420ms;
  --font:"Yuanti SC","PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","Noto Serif CJK SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f3e2c0;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
#fit{position:fixed;inset:0;display:grid;place-items:center}
#book{width:1180px;height:820px;position:relative;transform-origin:center center;overflow:hidden;background:var(--cream);border-radius:28px}

/* ---------- CSS-drawn reading corner ---------- */
.wall{position:absolute;inset:0 0 300px 0;background:
  radial-gradient(circle at 20% 10%,#fffaf0 0,transparent 55%),
  repeating-linear-gradient(90deg,transparent 0 58px,rgba(240,200,150,.16) 58px 62px),
  linear-gradient(#fff6e4,#fcecd0)}
.floor{position:absolute;left:0;right:0;bottom:0;height:300px;
  background:repeating-linear-gradient(90deg,#e7b97f 0 140px,#dfae73 140px 144px),#e5b47b}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:#c98f55;border-radius:0 0 6px 6px}
.window{position:absolute;left:440px;top:120px;width:220px;height:200px;border-radius:110px 110px 18px 18px;
  background:linear-gradient(#cfeefa,#e9f7fb 70%,#f6fbf0);border:14px solid #fff;box-shadow:0 0 0 6px #f1d7ad,0 10px 0 6px rgba(160,110,60,.12)}
.window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:#fff}
.window::after{content:"";position:absolute;left:34px;top:40px;width:54px;height:54px;border-radius:50%;background:#ffe08a;box-shadow:0 0 0 10px rgba(255,224,138,.35)}
.cloud{position:absolute;right:22px;top:96px;width:70px;height:24px;border-radius:20px;background:#fff;box-shadow:24px -12px 0 -2px #fff,10px -16px 0 0 #fff}
.shelf{position:absolute;right:46px;top:110px;width:330px;height:230px}
.shelf .board{position:absolute;left:0;right:0;height:14px;background:var(--wood-2);border-radius:7px;box-shadow:0 6px 0 rgba(120,70,30,.15)}
.shelf .row{position:absolute;left:14px;right:14px;height:84px;display:flex;align-items:flex-end;gap:6px}
.book{width:26px;border-radius:5px 5px 2px 2px}
.plant{position:absolute;left:392px;top:412px;width:90px;height:110px}
.plant .pot{position:absolute;bottom:0;left:15px;width:60px;height:48px;background:#e98b6a;border-radius:8px 8px 18px 18px}
.plant .lf{position:absolute;width:34px;height:60px;background:var(--leaf);border-radius:34px 0}
.rug{position:absolute;left:480px;right:40px;bottom:166px;height:86px;border-radius:50%;
  background:radial-gradient(ellipse at center,#f6c6a6 0 40%,#f2b48e 41% 46%,#f6c6a6 47% 64%,#eea47d 65% 70%,#f4bc98 71%)}
.cushion{position:absolute;left:28px;bottom:160px;width:360px;height:70px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#f9d77e,#eab64c)}
.lamp{position:absolute;left:360px;top:40px;width:4px;height:80px;background:#c9a37a}
.lamp::after{content:"";position:absolute;left:-30px;top:78px;width:64px;height:40px;border-radius:32px 32px 8px 8px;background:#ffd88c;box-shadow:0 18px 40px 10px rgba(255,214,140,.45)}

/* ---------- header ---------- */
header{position:absolute;left:28px;right:28px;top:20px;height:72px;display:flex;align-items:center;gap:16px;z-index:5}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:2px;background:#fff;padding:8px 22px;border-radius:999px;box-shadow:0 4px 0 #f1d7ad}
.stars{display:flex;gap:8px;margin-left:auto;background:#fff;padding:6px 14px;border-radius:999px;box-shadow:0 4px 0 #f1d7ad}
.star{width:52px;height:52px;display:grid;place-items:center}
.star svg{width:46px;height:46px}
.star path{fill:#efe2c8;stroke:#d8c19a;stroke-width:2;transition:fill var(--dur-short) var(--ease-out),stroke var(--dur-short) var(--ease-out)}
.star.on path{fill:var(--star);stroke:#e7a300}
.ctl{min-width:64px;height:64px;border-radius:999px;border:0;background:#fff;box-shadow:0 4px 0 #f1d7ad;font-size:26px;cursor:pointer;padding:0 14px;
  transition:transform var(--dur-micro) var(--ease-out),background-color var(--dur-short) var(--ease-out)}
.ctl:active{transform:translateY(2px);box-shadow:0 2px 0 #f1d7ad}
.ctl:focus-visible,.card:focus-visible,.char:focus-visible{outline:4px solid #3b82c4;outline-offset:4px}

/* ---------- characters ---------- */
.char{position:absolute;border:0;background:none;padding:0;cursor:pointer;z-index:3}
.char .idle,.char .act,.char .blink{transform-origin:50% 100%}
.char img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.rig{position:relative;width:100%;aspect-ratio:1/1}
.rig > .L{position:absolute;inset:0;width:100%;height:100%}
/* dog rig: canvas-relative geometry (fractions of the 1254px source) */
#dog .tail{transform-origin:71.8% 72.2%}
#dog .head{transform-origin:51% 56%}
#dog .head img{position:absolute;inset:0;width:100%;height:100%}
.lid{position:absolute;border-radius:50%;overflow:hidden;pointer-events:none}
.lid::before{content:"";position:absolute;inset:-2px;background:#c29e80;border-bottom:3px solid #5b3a2a;border-radius:0 0 50% 50%;
  transform:translateY(-104%);transform-origin:50% 0}
.lid::before{transition:transform 70ms cubic-bezier(0.65,0,0.35,1)}
.lid.shut::before{transform:translateY(0)}
#lidL{left:38.2%;top:36.2%;width:8%;height:8.2%}
#lidR{left:57.2%;top:33.6%;width:7%;height:7.8%}
.mouth{position:absolute;left:48.6%;top:47.6%;width:9.6%;height:6%;transform-origin:50% 6%;transform:scaleY(0);opacity:0;overflow:visible}
/* bunny rig */
#bunny .ear{transform-origin:61.4% 20.7%}
#elephant{left:44px;bottom:186px;width:320px}
#bunny{left:530px;bottom:196px;width:160px}
#cat{left:740px;bottom:196px;width:132px}
#dog{left:925px;bottom:196px;width:170px}
.shadow{position:absolute;left:18%;right:18%;bottom:calc(var(--foot,7.5%) - 14px);height:26px;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(110,62,24,.30) 0,rgba(110,62,24,.16) 45%,rgba(110,62,24,0) 72%)}
#elephant{--foot:calc(320px*.0758)} #bunny{--foot:calc(160px*.0797)} #cat{--foot:calc(132px*.1108)} #dog{--foot:calc(170px*.0734)}
#elephant .shadow{left:12%;right:12%;height:34px}

@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,1.028)}}
@keyframes wag{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes hopIdle{0%,86%,100%{transform:translateY(0)}91%{transform:translateY(-12px)}96%{transform:translateY(0) scale(1.04,.96)}}
.char .idle{animation:breathe 3.6s var(--ease-in-out) infinite}
#elephant .idle{animation-duration:4s}
#cat .idle{animation-delay:-1.2s}
#dog .idle{animation-delay:-.6s}
@keyframes tailWag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes earTwitch{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-5deg)}96%{transform:rotate(3deg)}}
#dog .tail{animation:tailWag .9s var(--ease-in-out) infinite}
#bunny .ear{animation:earTwitch 5.5s var(--ease-in-out) infinite}
#bunny .blink{animation:hopIdle 4s var(--ease-out) infinite}
.paused .char .idle,.paused .char .blink,.paused #dog .tail,.paused #bunny .ear{animation-play-state:paused}

/* ---------- speech bubbles ---------- */
.bubble{position:absolute;background:#fff;border-radius:28px;padding:14px 26px;box-shadow:0 6px 0 rgba(200,150,90,.25);z-index:6;
  opacity:0;transform:translateY(8px) scale(.96);pointer-events:none;
  transition:opacity calc(var(--dur-short)*.65) var(--ease-in),transform calc(var(--dur-short)*.65) var(--ease-in)}
.bubble.show{opacity:1;transform:none;transition:opacity var(--dur-long) var(--ease-out),transform var(--dur-long) var(--ease-out)}
.bubble::after{content:"";position:absolute;width:30px;height:30px;background:#fff;transform:rotate(45deg);border-radius:4px}
#eBubble{left:290px;top:108px;width:720px;white-space:nowrap;text-align:center;padding:18px 26px 20px}
#eBubble::after{left:60px;bottom:-12px}
#eBubble .zi{font-size:24px;color:var(--ink-2);font-weight:700;display:block;margin-bottom:2px}
.line{font-size:42px;font-weight:800;line-height:1.25;letter-spacing:2px}
ruby{ruby-position:over;margin:0 1px}
rt{font-size:20px;font-weight:600;color:#c0622f;letter-spacing:0;font-family:"Nunito","Varela Round","Arial Rounded MT Bold",system-ui,sans-serif}
.ch.hl{color:var(--accent)}
.aBubble{bottom:100%;margin-bottom:18px;width:max-content;max-width:400px;white-space:nowrap;left:50%;transform:translateX(-50%) translateY(8px) scale(.96);font-size:28px;font-weight:800;line-height:1.35;text-align:center}
.aBubble::after{left:50%;margin-left:-15px;bottom:-12px}
.aBubble.show{transform:translateX(-50%)}
#dog .aBubble{left:auto;right:0;transform:translateY(8px) scale(.96)}
#dog .aBubble.show{transform:none}
#dog .aBubble::after{left:auto;right:60px}
#elephant .aBubble{left:60%}
.note{position:absolute;left:50%;top:38px;transform:translateX(-50%);background:#fff3d1;border-radius:999px;padding:6px 18px;font-size:20px;color:var(--ink-2);z-index:5;display:none}
.note.show{display:block}

/* ---------- sentence cards ---------- */
.cards{position:absolute;left:28px;right:28px;bottom:22px;height:146px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;z-index:4}
.card{position:relative;border:0;border-radius:30px;background:#fff;cursor:pointer;text-align:left;padding:18px 22px 18px 92px;min-height:56px;
  box-shadow:0 6px 0 #f1d7ad;transition:transform var(--dur-micro) var(--ease-out),background-color var(--dur-short) var(--ease-out),box-shadow var(--dur-micro) var(--ease-out)}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 #f1d7ad}
.card .num{position:absolute;left:20px;top:50%;margin-top:-30px;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;background:var(--c)}
.card .txt{font-size:32px;font-weight:800;line-height:1.3;letter-spacing:1px;display:block}
.card .hint{font-size:20px;color:var(--ink-2);display:block;margin-top:4px}
.card.playing{background:#fff1dd}
.card.heard .num::after{content:"★";position:absolute;right:-8px;top:-10px;font-size:26px;color:var(--star);text-shadow:0 2px 0 #e7a300}

/* sparkles */
.spark{position:absolute;opacity:0;pointer-events:none;z-index:7;font-size:30px;color:var(--star);text-shadow:0 2px 0 rgba(231,163,0,.5);left:0;top:0}

@media (prefers-reduced-motion: reduce){
  .char .idle,.char .blink,#dog .tail,#bunny .ear{animation:none !important}
  .lid::before{transition:none}
  .bubble,.bubble.show{transition:opacity 150ms linear !important}
  #eBubble,#eBubble.show,#dog .aBubble,#dog .aBubble.show{transform:none !important}
  .aBubble,.aBubble.show{transform:translateX(-50%) !important}
  .card,.ctl{transition:background-color 150ms linear}
  .card:active,.ctl:active{transform:none}
}
/* ================= v3 additions ================= */
header{justify-content:flex-start}
#eBubble,.note{display:none!important}
/* cards = subtitles (text + pinyin only) */
.cards{height:150px;bottom:20px}
.card{padding:14px 16px 14px 84px;cursor:default;transition:transform var(--dur-long) var(--ease-out),opacity var(--dur-long) var(--ease-out),background-color var(--dur-short) var(--ease-out),box-shadow var(--dur-short) var(--ease-out)}
.free .card{cursor:pointer}
.card .num{left:14px}
.card .txt{font-size:30px;line-height:1.05;letter-spacing:0}
.card .txt .br{display:block;height:6px}
.card rt{font-size:15px}
.card .k{display:inline-block;transition:color 120ms linear}
.card .k, .card .k ruby, .card .k rt{color:inherit}
.card .k{color:var(--ink)}
.cards.reading .card.playing .k{color:#c9b8a3}
.cards.reading .card.playing .k.done,.card .k.done{color:var(--c)}
.cards.reading .card.playing .k.cur,.card .k.cur{color:var(--c);transform:translateY(-3px) scale(1.18);transition:transform 160ms var(--ease-out),color 120ms linear}
.cards.reading .card{opacity:.5}
.cards.reading .card.playing{opacity:1;transform:translateY(-10px) scale(1.04);background:#fffaf2;box-shadow:0 10px 0 color-mix(in srgb,var(--c) 45%,#f1d7ad),0 0 0 5px var(--c)}
.card .bar{position:absolute;left:84px;right:18px;bottom:10px;height:6px;border-radius:3px;background:#f3e6cf;overflow:hidden;opacity:0;transition:opacity var(--dur-short) linear}
.card .bar i{display:block;height:100%;width:100%;background:var(--c);transform-origin:0 50%;transform:scaleX(0)}
.card.playing .bar{opacity:1}
/* sound bubble (animal sounds only) */
.aBubble{font-size:34px}
/* tap hint: dot + two expanding rings, free-play only */
.tap{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;opacity:0;transition:opacity var(--dur-long) var(--ease-out);z-index:5}
.free .tap{opacity:1}
.char.busy .tap{opacity:0;transition-duration:var(--dur-micro)}
.tap b{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--accent),0 3px 8px rgba(120,60,20,.35)}
.tap i{position:absolute;inset:8px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px rgba(240,138,93,.55);animation:ring 1.8s var(--ease-out) infinite}
.tap i+i{animation-delay:.9s}
@keyframes ring{0%{transform:scale(.35);opacity:0}15%{opacity:1}100%{transform:scale(1.35);opacity:0}}
.paused .tap i{animation-play-state:paused}
#elephant .tap{left:84%;top:64%} #bunny .tap{left:80%;top:74%} #cat .tap{left:84%;top:74%} #dog .tap{left:84%;top:74%}
/* ---------- title screen ---------- */
#title{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 42%,rgba(255,251,240,.97) 0,rgba(255,246,228,.94) 45%,rgba(251,233,200,.9) 100%)}
#title.gone{pointer-events:none}
.tt{display:flex;flex-direction:column;align-items:center;gap:10px;transform:translateY(-30px)}
.tt .sub{font-size:44px;font-weight:800;color:var(--ink-2);letter-spacing:10px;display:flex;gap:18px}
.tt .main{font-size:132px;font-weight:900;letter-spacing:6px;display:flex;gap:6px;color:var(--ink);text-shadow:0 6px 0 #f1d7ad}
.tt .t{display:inline-block;opacity:0;transition:color 160ms linear}
.tt .t.done{color:var(--accent)}
.tt .t.cur{color:var(--accent)}
.tt .main .t:nth-child(1){--c:#f08a5d}.tt .main .t:nth-child(2){--c:#f4a259}.tt .main .t:nth-child(3){--c:#5fb3a1}.tt .main .t:nth-child(4){--c:#7a8fd6}.tt .main .t:nth-child(5){--c:#e98bb0}
.tt .main .t.done,.tt .main .t.cur{color:var(--c)}
#startBtn{margin-top:46px;width:150px;height:150px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;position:relative;
  box-shadow:0 10px 0 #c8653a;display:grid;place-items:center;opacity:0;transition:transform var(--dur-micro) var(--ease-out),box-shadow var(--dur-micro) var(--ease-out)}
#startBtn svg{width:64px;height:64px;margin-left:10px}
#startBtn:active{transform:translateY(5px);box-shadow:0 5px 0 #c8653a}
#startBtn:focus-visible{outline:5px solid #3b82c4;outline-offset:6px}
#startBtn::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:6px solid rgba(240,138,93,.45);animation:ring 2s var(--ease-out) infinite}
.paused #startBtn::before{animation-play-state:paused}
.tt .peek{display:flex;gap:26px;margin-top:8px;height:110px;align-items:flex-end}
.tt .peek img{height:100px;width:auto;opacity:0}
@media (prefers-reduced-motion: reduce){
  .card,.card .k.cur{transition:opacity 150ms linear,background-color 150ms linear,color 120ms linear!important;transform:none!important}
  .cards.reading .card.playing{transform:none}
  .tap i{animation:none;transform:scale(1);opacity:.9}
  #startBtn::before{animation:none}
}
</style>
</head>
<body>
<div id="fit"><div id="book">
  <div class="wall"></div><div class="floor"></div>
  <div class="lamp"></div>
  <div class="window"><div class="cloud"></div></div>
  <div class="shelf" id="shelf"></div>
  <div class="cushion"></div>
  <div class="rug"></div>

  <header>
    <button class="ctl" id="pauseBtn" aria-pressed="false" aria-label="暂停" title="暂停/继续（给大人）">⏸</button>
    <div class="stars" role="img" aria-label="0 / 3" id="stars">
      <span class="star"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4L2.8 9.3l6.4-.8z" stroke-linejoin="round"/></svg></span>
      <span class="star"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4L2.8 9.3l6.4-.8z" stroke-linejoin="round"/></svg></span>
      <span class="star"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4L2.8 9.3l6.4-.8z" stroke-linejoin="round"/></svg></span>
    </div>
  </header>

  <button class="char" id="elephant" aria-label="大象老师"><div class="idle"><div class="act"><div class="blink"><img alt="" src="__ELEPHANT__"></div></div></div><span class="shadow"></span><span class="tap"><i></i><i></i><b></b></span><div class="bubble aBubble"></div></button>
  <button class="char" id="bunny" aria-label="小兔子"><div class="idle"><div class="act"><div class="blink rig"><img class="L ear" alt="" src="__BUNNY_EAR__"><img class="L" alt="" src="__BUNNY_BASE__"></div></div></div><span class="shadow"></span><span class="tap"><i></i><i></i><b></b></span><div class="bubble aBubble"></div></button>

      <svg class="mouth" id="dogMouth" viewBox="0 0 110 70" aria-hidden="true"><path d="M2 6 Q55 -2 108 6 Q102 64 55 68 Q8 64 2 6Z" fill="#5a2a20"/><ellipse cx="55" cy="52" rx="27" ry="14" fill="#ec8f8c"/><path d="M8 7 Q55 1 102 7" stroke="#4a2218" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
    </div>

      <button id="startBtn" aria-label="开始"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" fill="#fff"/></svg></button>
    </div>
  </div>
</div></div>
<script>
(() => {
const AUD = __AUDIO__;
const TIM = __TIMINGS__;
const SENT = [
  { text:"学而时习之，不亦说乎？", py:["xué","ér","shí","xí","zhī","","bù","yì","yuè","hū",""], color:"#f08a5d", e:"e1", u:"u1" },
  { text:"有朋自远方来，不亦乐乎？", py:["yǒu","péng","zì","yuǎn","fāng","lái","","bù","yì","lè","hū",""], color:"#5fb3a1", e:"e2", u:"u2" },
  { text:"人不知而不愠，不亦君子乎？", py:["rén","bù","zhī","ér","bù","yùn","","bù","yì","jūn","zǐ","hū",""], color:"#7a8fd6", e:"e3", u:"u3" },
];
const SOLO = { bunny:{s:0, clip:"b1", sound:"squeak", word:"吱吱～"}, cat:{s:1, clip:"c2", sound:"meow", word:"喵～"}, dog:{s:2, clip:"d3", sound:"woof", word:"汪汪！"} };
const KIDS = ["bunny","cat","dog"];
const $ = s => document.querySelector(s);
const book = $("#book");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const EASE_OUT = "cubic-bezier(0.16,1,0.3,1)";
const setStep = s => { book.dataset.step = s; };
window.__log = [];

/* fit the 1180x820 page to any screen */
function fit(){ const s = Math.min(innerWidth/1180, innerHeight/820); book.style.transform = `scale(${s})`; }
addEventListener("resize", fit); fit();

/* bookshelf + plant (CSS-drawn) */
(() => {
  const shelf = $("#shelf"); const cols = ["#f08a5d","#ffc93c","#8cc084","#7a8fd6","#e98bb0","#5fb3a1","#f4a259"];
  [0,1].forEach(r => {
    const row = document.createElement("div"); row.className = "row"; row.style.top = (r*108+10)+"px";
    for (let i=0;i<9;i++){ const b=document.createElement("span"); b.className="book";
      b.style.height=(58+((i*37+r*13)%26))+"px"; b.style.background=cols[(i+r*3)%cols.length]; row.appendChild(b); }
    const bd = document.createElement("div"); bd.className="board"; bd.style.top=(r*108+94)+"px";
    shelf.append(row, bd);
  });
  const p = document.createElement("div"); p.className="plant";
  p.innerHTML = '<span class="lf" style="left:6px;top:8px;transform:rotate(-30deg)"></span><span class="lf" style="left:48px;top:4px;transform:scaleX(-1) rotate(-30deg)"></span><span class="lf" style="left:28px;top:-10px"></span><span class="pot"></span>';
  book.insertBefore(p, $(".cushion"));
})();

/* ---------- pause (adult control): audio + script timeline + every animation ---------- */
let paused = false, userPaused = false, clipActive = false;
const heldAnims = new Set();
const au = new Audio(); au.preload = "auto";
const pauseBtn = $("#pauseBtn");
function setPaused(v){
  if (v === paused) return; paused = v;
  book.classList.toggle("paused", v);
  pauseBtn.textContent = userPaused ? "▶" : "⏸"; pauseBtn.setAttribute("aria-pressed", userPaused);
  if (v){
    au.pause();
    document.getAnimations().forEach(a => { if (a.playState === "running"){ a.pause(); heldAnims.add(a); } });
  } else {
    heldAnims.forEach(a => { try{ a.play(); }catch(e){} }); heldAnims.clear();
    if (clipActive && !au.ended && au.src) au.play().catch(()=>{});
  }
}
pauseBtn.addEventListener("click", e => { e.stopPropagation(); userPaused = !userPaused; setPaused(userPaused || document.hidden); pauseBtn.textContent = userPaused ? "▶" : "⏸"; });
document.addEventListener("visibilitychange", () => setPaused(userPaused || document.hidden));
/* pause-aware wait: only counts time while not paused */
function wait(ms){
  return new Promise(res => { let left = ms, last = performance.now();
    const tick = () => { const n = performance.now(); if (!paused) left -= n - last; last = n; left <= 0 ? res() : setTimeout(tick, Math.min(50, left)); };
    setTimeout(tick, Math.min(50, Math.max(ms,0))); });
}
const sleep = wait;

/* ---------- sentence cards = subtitles (text + pinyin only) ---------- */
const cardsEl = $("#cards");
SENT.forEach((s,i) => {
  const b = document.createElement("button"); b.className = "card"; b.style.setProperty("--c", s.color);
  b.setAttribute("aria-label", s.text);
  const ks = [...s.text].map((ch,k) => {
    const inner = s.py[k] ? `<ruby>${ch}<rt>${s.py[k]}</rt></ruby>` : ch;
    return `<span class="k">${inner}</span>` + (ch === "，" ? '<span class="br"></span>' : "");
  }).join("");
  b.innerHTML = `<span class="num">${i+1}</span><span class="txt">${ks}</span><span class="bar"><i></i></span>`;
  b.addEventListener("click", () => cardTap(i));
  cardsEl.appendChild(b);
});
const cards = [...cardsEl.children];
const K = i => ({ els:[...cards[i].querySelectorAll(".k")], bar:cards[i].querySelector(".bar i") });
function focusCard(i){ cardsEl.classList.add("reading"); cards.forEach((c,k)=>c.classList.toggle("playing", k===i)); }
function unfocus(){ cardsEl.classList.remove("reading"); cards.forEach(c=>c.classList.remove("playing")); }

/* ---------- karaoke: highlight follows the audio clock ---------- */
function karaReset(k){ k.els.forEach(e=>e.classList.remove("done","cur")); if (k.bar) k.bar.style.transform = "scaleX(0)"; }
function karaTick(k, times, dur, t){
  let cur = -1; times.forEach((x,i) => { if (x != null && x <= t) cur = i; });
  const lastT = Math.max(...times.filter(x=>x!=null));
  const end = t >= lastT + 0.35;
  k.els.forEach((e,i) => { e.classList.toggle("done", end || i < cur); e.classList.toggle("cur", !end && i === cur); });
  if (k.bar) k.bar.style.transform = `scaleX(${Math.min(1, Math.max(0, t/(lastT+0.35)))})`;
}
function karaFinish(k){ k.els.forEach(e=>{ e.classList.remove("cur"); e.classList.add("done"); }); if (k.bar) k.bar.style.transform = "scaleX(1)"; }

/* ---------- motion helpers (WAAPI; reduced-motion = opacity/glow only) ---------- */
const actOf = id => $("#"+id+" .act");
const shadowOf = id => $("#"+id+" .shadow");
/* one declared big "character moment" per animal (see header note on the deliberate deviation) */
const BIG = { elephant:"trumpet", bunny:"bigHop", cat:"spin", dog:"flip" };
function moves(kind){
  const L = "linear", UP = "cubic-bezier(0.2,0.7,0.3,1)", DOWN = "cubic-bezier(0.6,0,0.85,0.4)", OUT = EASE_OUT;
  const K = {
    bob:   {o:"50% 100%", d:700, e:OUT, k:[{transform:"translateY(0)"},{transform:"translateY(-10px) rotate(-1deg)",offset:.35},{transform:"translateY(0)",offset:.7},{transform:"translateY(-4px)",offset:.85},{transform:"translateY(0)"}]},
    nod:   {o:"50% 100%", d:760, e:"cubic-bezier(0.65,0,0.35,1)", k:[{transform:"rotate(0)"},{transform:"rotate(3deg) translateY(4px)",offset:.3},{transform:"rotate(-1deg)",offset:.6},{transform:"rotate(2deg) translateY(2px)",offset:.8},{transform:"rotate(0)"}]},
    bounce:{o:"50% 100%", d:560, e:OUT, k:[{transform:"translateY(0) scale(1,1)"},{transform:"translateY(-26px) scale(.97,1.04)",offset:.4},{transform:"translateY(0) scale(1.06,.94)",offset:.72},{transform:"translateY(0) scale(1,1)"}]},
    /* dog: crouch -> launch -> full 360° back-flip in the air -> squash landing -> settle */
    flip:  {o:"50% 58%", d:1250, e:L, k:[
      {transform:"translateY(0) rotate(0) scale(1,1)", easing:"cubic-bezier(0.65,0,0.35,1)"},
      {transform:"translateY(14px) rotate(0) scale(1.14,.8)", offset:.14, easing:UP},
      {transform:"translateY(-150px) rotate(-90deg) scale(.94,1.08)", offset:.32, easing:L},
      {transform:"translateY(-215px) rotate(-190deg) scale(1,1)", offset:.47, easing:L},
      {transform:"translateY(-150px) rotate(-290deg) scale(1,1)", offset:.62, easing:DOWN},
      {transform:"translateY(16px) rotate(-360deg) scale(1.18,.78)", offset:.76, easing:OUT},
      {transform:"translateY(-22px) rotate(-360deg) scale(.95,1.06)", offset:.88, easing:"cubic-bezier(0.65,0,0.35,1)"},
      {transform:"translateY(0) rotate(-360deg) scale(1,1)"}]},
    /* bunny: deep crouch -> big hop with a little twist -> squash -> small rebound */
    bigHop:{o:"50% 100%", d:1100, e:L, k:[
      {transform:"translateY(0) scale(1,1) rotate(0)", easing:"cubic-bezier(0.65,0,0.35,1)"},
      {transform:"translateY(0) scale(1.16,.8) rotate(0)", offset:.16, easing:UP},
      {transform:"translateY(-170px) scale(.9,1.12) rotate(-8deg)", offset:.42, easing:DOWN},
      {transform:"translateY(0) scale(1.18,.8) rotate(4deg)", offset:.66, easing:OUT},
      {transform:"translateY(-48px) scale(.96,1.05) rotate(-2deg)", offset:.82, easing:DOWN},
      {transform:"translateY(0) scale(1.06,.94) rotate(0)", offset:.93, easing:OUT},
      {transform:"translateY(0) scale(1,1) rotate(0)"}]},
    /* cat: stretch-crouch (pounce wind-up) -> leap with a full pirouette -> land */
    spin:  {o:"50% 100%", d:1150, e:L, k:[
      {transform:"perspective(700px) translate(0,0) rotateY(0) scale(1,1) skewX(0)", easing:"cubic-bezier(0.65,0,0.35,1)"},
      {transform:"perspective(700px) translate(-10px,6px) rotateY(0) scale(1.18,.8) skewX(-10deg)", offset:.2, easing:UP},
      {transform:"perspective(700px) translate(0,-130px) rotateY(180deg) scale(.95,1.08) skewX(0)", offset:.48, easing:DOWN},
      {transform:"perspective(700px) translate(0,0) rotateY(360deg) scale(1.14,.84) skewX(0)", offset:.74, easing:OUT},
      {transform:"perspective(700px) translate(0,-16px) rotateY(360deg) scale(.97,1.04) skewX(0)", offset:.87, easing:"cubic-bezier(0.65,0,0.35,1)"},
      {transform:"perspective(700px) translate(0,0) rotateY(360deg) scale(1,1) skewX(0)"}]},
    /* elephant: rise + lean back (trunk up) -> big happy sway ×2 -> settle */
    trumpet:{o:"50% 100%", d:1300, e:L, k:[
      {transform:"translateY(0) rotate(0) scale(1)", easing:"cubic-bezier(0.65,0,0.35,1)"},
      {transform:"translateY(-34px) rotate(-8deg) scale(1.07)", offset:.25, easing:"cubic-bezier(0.65,0,0.35,1)"},
      {transform:"translateY(-20px) rotate(6deg) scale(1.05)", offset:.48, easing:"cubic-bezier(0.65,0,0.35,1)"},
      {transform:"translateY(-26px) rotate(-5deg) scale(1.05)", offset:.68, easing:"cubic-bezier(0.65,0,0.35,1)"},
      {transform:"translateY(0) rotate(2deg) scale(1)", offset:.86, easing:OUT},
      {transform:"translateY(0) rotate(0) scale(1)"}]},
  };
  return K[kind];
}
/* secondary layers that follow a big move */
function secondary(id, kind, dur){
  const out = [];
  const sh = shadowOf(id);
  const shK = { flip:[[0,1,1],[.14,1.1,1],[.47,.45,.35],[.76,1.15,1],[1,1,1]],
                bigHop:[[0,1,1],[.16,1.1,1],[.42,.5,.4],[.66,1.12,1],[.82,.85,.8],[1,1,1]],
                spin:[[0,1,1],[.2,1.12,1],[.48,.6,.5],[.74,1.1,1],[1,1,1]],
                trumpet:[[0,1,1],[.25,.9,.8],[.86,1,1],[1,1,1]] }[kind];
  if (shK) out.push(sh.animate(shK.map(([o,s,a])=>({offset:o,transform:`scale(${s})`,opacity:a})), {duration:dur, easing:"linear"}));
  if (id==="dog"){
    out.push($("#dog .tail").animate([{transform:"rotate(0)"},{transform:"rotate(-24deg)",offset:.3},{transform:"rotate(18deg)",offset:.6},{transform:"rotate(-16deg)",offset:.8},{transform:"rotate(0)"}],{duration:dur,easing:"linear",composite:"add"}));
    out.push($("#dog .head").animate([{transform:"rotate(0)"},{transform:"rotate(0)",offset:.72},{transform:"rotate(-6deg) translateY(6px)",offset:.8},{transform:"rotate(4deg)",offset:.9},{transform:"rotate(0)"}],{duration:dur,easing:"cubic-bezier(0.65,0,0.35,1)"}));
  }
  if (id==="bunny"){   /* ear lags behind the body: up on launch, floppy on landing */
    out.push($("#bunny .ear").animate([{transform:"rotate(0)"},{transform:"rotate(0)",offset:.16},{transform:"rotate(-8deg)",offset:.3},{transform:"rotate(10deg)",offset:.5},
      {transform:"rotate(17deg)",offset:.7},{transform:"rotate(-5deg)",offset:.84},{transform:"rotate(4deg)",offset:.93},{transform:"rotate(0)"}],{duration:dur,easing:"linear"}));
  }
  return out;
}
let live = {};   // id -> running animations (so a new tap cancels the old move)
function react(id, kind){
  const el = actOf(id);
  (live[id]||[]).forEach(a => a.cancel());
  if (reduce.matches){
    const a = el.animate([{opacity:1},{opacity:.6},{opacity:1}], {duration:360, easing:"linear"});
    live[id] = [a]; return a.finished.catch(()=>{});
  }
  const m = moves(kind);
  el.style.transformOrigin = m.o;
  const a = el.animate(m.k, {duration:m.d, easing:m.e});
  live[id] = [a, ...secondary(id, kind, m.d)];
  if (kind==="trumpet") notes(id);
  return a.finished.catch(()=>{});
}
/* elephant's "trumpet": a few ♪ float up from the trunk tip */
function notes(id){
  const host = $("#"+id), r = host.getBoundingClientRect(), br = book.getBoundingClientRect(), sc = br.width/1180;
  const x0 = (r.left - br.left + r.width*.76)/sc, y0 = (r.top - br.top + r.height*.38)/sc;
  for (let i=0;i<4;i++){
    const s = document.createElement("span"); s.className = "spark"; s.textContent = i%2 ? "♫" : "♪"; s.style.color = "#7a8fd6"; s.style.textShadow="none"; s.style.fontSize = (30+i*4)+"px";
    book.appendChild(s);
    const dx = 30 + i*26, dy = -110 - i*30;
    const a = s.animate([{transform:`translate(${x0}px,${y0}px) scale(.4)`,opacity:0},{opacity:1,offset:.2},
      {transform:`translate(${x0+dx}px,${y0+dy}px) scale(1) rotate(${i%2?12:-12}deg)`,opacity:0}],{duration:1200,easing:EASE_OUT,delay:150+i*140,fill:"backwards"});
    a.finished.then(()=>s.remove()).catch(()=>s.remove());
  }
}
/* dog mouth: flaps while speaking; reduced motion = simply shown open */
const mouth = $("#dogMouth"); let mouthAnim = null;
function talk(on){
  if (mouthAnim){ mouthAnim.cancel(); mouthAnim = null; }
  if (!on){ mouth.style.opacity = 0; mouth.style.transform = "scaleY(0)"; return; }
  if (reduce.matches){ mouth.style.opacity = 1; mouth.style.transform = "scaleY(.8)"; return; }
  mouth.style.opacity = 1;
  mouthAnim = mouth.animate([{transform:"scaleY(.12)"},{transform:"scaleY(1)",offset:.35},{transform:"scaleY(.35)",offset:.6},{transform:"scaleY(.85)",offset:.8},{transform:"scaleY(.12)"}],
    {duration:420, iterations:Infinity, easing:"cubic-bezier(0.65,0,0.35,1)"});
}
/* dog real blink (eyelids slide down and up) */
function dogBlink(double){
  if (reduce.matches) return;
  const run = () => document.querySelectorAll("#dog .lid").forEach(l => {
    const p = l; p.classList.add("shut"); setTimeout(()=>p.classList.remove("shut"), 110);
  });
  run(); if (double) setTimeout(run, 260);
}
function sparkle(id, n=7, big=false){
  const host = $("#"+id), r = host.getBoundingClientRect(), br = book.getBoundingClientRect(), sc = br.width/1180;
  const cx = (r.left - br.left + r.width/2)/sc, cy = (r.top - br.top + r.height*.35)/sc;
  for (let i=0;i<n;i++){
    const s = document.createElement("span"); s.className = "spark"; s.textContent = i%3 ? "✦" : "★";
    if (big) s.style.fontSize = (28+Math.random()*22)+"px";
    book.appendChild(s);
    const ang = (i/n)*Math.PI*2 + Math.random()*.5, dist = (big?160:90) + Math.random()*40;
    const x = cx + Math.cos(ang)*dist, y = cy + Math.sin(ang)*dist*.8;
    const a = reduce.matches
      ? s.animate([{transform:`translate(${x}px,${y}px)`,opacity:0},{transform:`translate(${x}px,${y}px)`,opacity:1,offset:.3},{transform:`translate(${x}px,${y}px)`,opacity:0}],{duration:700,fill:"both"})
      : s.animate([{transform:`translate(${cx}px,${cy}px) scale(.3)`,opacity:0},{opacity:1,offset:.25},{transform:`translate(${x}px,${y}px) scale(1) rotate(90deg)`,opacity:0}],{duration:big?1100:720,easing:EASE_OUT,delay:i*25,fill:"backwards"});
    a.finished.then(()=>s.remove()).catch(()=>s.remove());
  }
}

function bubbleOf(id){ return $("#"+id+" .aBubble"); }
function hideBubbles(){ document.querySelectorAll(".aBubble.show").forEach(b=>b.classList.remove("show")); }

/* ---------- talking: gentle bob on the character layer (+ dog mouth) ---------- */
const talkAnims = {};
function talkStart(ids){
  ids.forEach(id => {
    $("#"+id).classList.add("busy");
    if (id === "dog") talk(true);
    if (reduce.matches || talkAnims[id]) return;
    const el = $("#"+id+" .act > *");
    const big = id === "elephant";
    talkAnims[id] = el.animate([{transform:"translateY(0) rotate(0)"},{transform:`translateY(${big?-4:-6}px) rotate(${big?-1.2:-2.5}deg)`,offset:.3},
      {transform:`translateY(0) rotate(${big?1:2}deg)`,offset:.65},{transform:"translateY(0) rotate(0)"}],
      {duration: big ? 1100 : 600 + KIDS.indexOf(id)*40, iterations:Infinity, easing:"cubic-bezier(0.65,0,0.35,1)"});
  });
}
function talkStop(ids){
  ids.forEach(id => { $("#"+id).classList.remove("busy"); if (id === "dog") talk(false);
    if (talkAnims[id]){ talkAnims[id].cancel(); delete talkAnims[id]; } });
}

/* ---------- audio clips (pre-rendered, embedded) ---------- */
let clipToken = 0, curFin = null;
function playClip(key, { kara = null, talkers = [], strict = false } = {}){
  const my = ++clipToken; const T = TIM[key];
  window.__log.push({ key, t: Date.now() });
  return new Promise(res => {
    let done = false, fallback = false, fbT = 0, wall = 0, last = performance.now(), raf = 0;
    const fin = (ok = true) => { if (done) return; done = true; clipActive = false; cancelAnimationFrame(raf);
      if (curFin === fin) curFin = null; talkStop(talkers); if (kara) (ok ? karaFinish(kara) : karaReset(kara)); res(ok); };
    curFin = fin;
    if (kara) karaReset(kara);
    talkStart(talkers);
    const loop = () => {
      if (my !== clipToken || done) return;
      const n = performance.now(); const dt = (n - last)/1000; last = n;
      if (!paused){ wall += dt; if (fallback) fbT += dt; }
      const t = fallback ? fbT : au.currentTime;
      if (kara) karaTick(kara, T.t, T.dur, t);
      if ((fallback && fbT >= T.dur) || wall > T.dur + 2.5){ fin(); return; }   // never hang the script
      raf = requestAnimationFrame(loop);
    };
    au.onended = () => { if (my === clipToken) fin(); };
    au.src = AUD[key]; clipActive = true;
    const p = au.play();
    if (p) p.catch(() => { if (my !== clipToken) return; if (strict){ fin(false); return; } fallback = true; });
    raf = requestAnimationFrame(loop);
  });
}
function stopAudio(){ clipToken++; au.pause(); if (curFin) curFin(false); }

/* ---------- motion bits ---------- */
function groupBounce(){ KIDS.forEach((id,k) => setTimeout(() => react(id, "bounce"), k*90)); }
function soundBubble(id, txt){ const b = bubbleOf(id); b.textContent = txt; b.classList.add("show"); }

/* ---------- title screen ---------- */
const titleEl = $("#title"), ttSub = $("#ttSub"), ttMain = $("#ttMain"), startBtn = $("#startBtn");
const ttText = TIM.title.text;                     // "论语 之 学而时习之"
const ttEls = [...ttText].map((ch, i) => { const s = document.createElement("span"); s.className = "t"; s.textContent = ch === " " ? "" : ch;
  (i < 4 ? ttSub : ttMain).appendChild(s); if (ch === " ") s.style.width = "0"; return s; });
const ttK = { els: ttEls, bar: null };
let titleState = "idle", titleDone = null;
function titleIntro(){
  const shown = ttEls.filter(e => e.textContent);
  shown.forEach((e,i) => {
    const kf = reduce.matches
      ? [{opacity:0},{opacity:1}]
      : [{opacity:0, transform:"translateY(-120px) scale(.5) rotate(-12deg)"},{opacity:1, transform:"translateY(14px) scale(1.12,.88) rotate(3deg)", offset:.6},
         {transform:"translateY(-8px) scale(.97,1.04)", offset:.8},{opacity:1, transform:"none"}];
    e.animate(kf, { duration: reduce.matches ? 300 : 760, delay: 150 + i*110, easing: reduce.matches ? "linear" : EASE_OUT, fill:"both" });
  });
  const d = 150 + shown.length*110 + 400;
  startBtn.animate(reduce.matches ? [{opacity:0},{opacity:1}] : [{opacity:0, transform:"scale(.4)"},{opacity:1, transform:"scale(1.08)", offset:.65},{opacity:1, transform:"scale(1)"}],
    { duration: reduce.matches ? 250 : 620, delay: d, easing: EASE_OUT, fill:"both" });
  return d;
}
function playTitle(strict){
  titleState = "playing"; setStep("title-voice");
  titleDone = playClip("title", { kara: ttK, talkers: [], strict }).then(ok => { titleState = ok ? "done" : "blocked"; if (!ok) setStep("title"); return ok; });
  return titleDone;
}
setStep("title");
const introMs = titleIntro();
/* try the title voice on load; browsers usually block sound before the first tap -> it plays on the first tap instead */
setTimeout(() => { if (titleState === "idle") playTitle(true); }, introMs);
titleEl.addEventListener("click", e => { if (e.target.closest("#startBtn")) return; if (titleState === "blocked" || titleState === "idle") playTitle(false); });
startBtn.addEventListener("click", async e => {
  e.stopPropagation();
  if (startBtn.disabled) return; startBtn.disabled = true;
  if (titleState === "blocked" || titleState === "idle") playTitle(false);   // called inside the tap = audio unlocked
  else if (titleState === "done"){ au.muted = true; au.src = AUD.title; au.play().then(()=>{ au.pause(); au.muted = false; }).catch(()=>{ au.muted = false; }); }
  await titleDone; await wait(300);
  const out = titleEl.animate(reduce.matches ? [{opacity:1},{opacity:0}] : [{opacity:1, transform:"scale(1)"},{opacity:0, transform:"scale(1.06)"}],
    { duration: reduce.matches ? 200 : 420, easing: "cubic-bezier(0.7,0,0.84,0)", fill:"forwards" });
  await out.finished.catch(()=>{}); titleEl.classList.add("gone"); titleEl.style.display = "none";
  show();
});

/* ---------- the script ---------- */
let runId = 0, free = false;
const heard = new Set();
function fillStar(i){
  if (heard.has(i)) return; heard.add(i);
  const st = document.querySelectorAll(".star")[i]; st.classList.add("on"); $("#stars").setAttribute("aria-label", `${heard.size} / 3`);
  if (!reduce.matches) st.animate([{transform:"scale(1)"},{transform:"scale(1.25)",offset:.45},{transform:"scale(1)"}],{duration:420,easing:EASE_OUT});
}
async function elephantLine(i, my){
  focusCard(i); setStep(`e${i+1}`); react("elephant","trumpet");
  await playClip(SENT[i].e, { kara:K(i), talkers:["elephant"] });
  return my === runId;
}
async function unisonLine(i, my){
  focusCard(i); setStep(`u${i+1}`); groupBounce(); sparkle("cat", 6);
  await wait(reduce.matches ? 100 : 380); if (my !== runId) return false;
  await playClip(SENT[i].u, { kara:K(i), talkers:KIDS });
  return my === runId;
}
async function solo(id, my){
  const S = SOLO[id];
  focusCard(S.s); setStep(`solo-${id}`);
  react(id, BIG[id]); sparkle(id, 6);
  await wait(reduce.matches ? 200 : 900); if (my !== runId) return false;
  await playClip(S.clip, { kara:K(S.s), talkers:[id] }); if (my !== runId) return false;
  await wait(220); if (my !== runId) return false;
  setStep(`sound-${id}`); soundBubble(id, S.word); react(id, "bounce"); if (id === "dog") dogBlink(true);
  await playClip(S.sound, { talkers: id === "dog" ? ["dog"] : [] });
  hideBubbles(); if (my !== runId) return false;
  await wait(250);
  return my === runId;
}
/* the elephant's real trumpet call (short, quiet) with the big trumpet move */
async function trumpet(my){
  setStep("trumpet"); react("elephant", "trumpet"); sparkle("elephant", 6);
  await playClip("trumpet", { talkers: [] });
  return my === runId;
}
async function show(){
  const my = ++runId; setStep("intro");
  ["elephant", ...KIDS].forEach((id,k) => setTimeout(() => react(id, "bounce"), k*120));
  await wait(900); if (my !== runId) return;
  if (!await trumpet(my)) return;
  await wait(300); if (my !== runId) return;
  for (let i = 0; i < 3; i++){
    if (!await elephantLine(i, my)) return;
    await wait(350); if (my !== runId) return;
    if (!await unisonLine(i, my)) return;
    await wait(650); if (my !== runId) return;
  }
  unfocus(); setStep("again");
  react("elephant", "nod"); soundBubble("elephant", "我们再来一遍吧");
  await playClip("again", { talkers:["elephant"] }); hideBubbles();
  if (my !== runId) return;
  await wait(500);
  for (const id of KIDS){ if (!await solo(id, my)) return; fillStar(SOLO[id].s); }
  unfocus(); setStep("celebrate");
  ["elephant", ...KIDS].forEach((id,k) => setTimeout(() => { react(id, BIG[id]); sparkle(id, 9, true); }, k*260));
  playClip("trumpet", { talkers: [] });
  await wait(2100); if (my !== runId) return;
  enterFree();
}
function enterFree(){ free = true; book.classList.add("free"); setStep("free"); }

/* ---------- free play: tap a character (or a card) ---------- */
function interrupt(){ if (userPaused){ userPaused = false; setPaused(document.hidden); pauseBtn.textContent = "⏸"; }
  const my = ++runId; stopAudio(); hideBubbles(); unfocus(); return my; }
["elephant", ...KIDS].forEach(id => $("#"+id).addEventListener("click", async () => {
  if (!free){ if (!reduce.matches && !$("#"+id).classList.contains("busy")) $("#"+id+" .act").animate([{transform:"rotate(0)"},{transform:"rotate(-3deg)",offset:.3},{transform:"rotate(2deg)",offset:.7},{transform:"rotate(0)"}],{duration:360,easing:"cubic-bezier(0.65,0,0.35,1)"}); return; }
  const my = interrupt();
  if (id === "elephant"){
    if (!await trumpet(my)) return; await wait(300); if (my !== runId) return;
    for (let i = 0; i < 3; i++){ if (!await elephantLine(i, my)) return; await wait(450); if (my !== runId) return; }
    unfocus(); setStep("free");
  } else {
    if (await solo(id, my)){ unfocus(); setStep("free"); }
  }
}));
async function cardTap(i){
  if (!free) return;
  const my = interrupt();
  if (!await elephantLine(i, my)) return; await wait(350); if (my !== runId) return;
  if (!await unisonLine(i, my)) return; unfocus(); setStep("free");
}

/* occasional blink */
(function scheduleBlink(){
  setTimeout(() => {
    if (!reduce.matches && !paused){
      const id = ["elephant","bunny","cat","dog","dog"][Math.floor(Math.random()*5)];
      if (id === "dog") dogBlink(Math.random() < .3);
      else if (!$("#"+id).classList.contains("busy")) $("#"+id+" .blink").animate([{transform:"scale(1,1)"},{transform:"scale(1.03,.94)",offset:.4},{transform:"scale(1,1)"}],{duration:220,easing:"cubic-bezier(0.65,0,0.35,1)"});
    }
    scheduleBlink();
  }, 2600 + Math.random()*3800);
})();

/* test hooks (screenshots only) */
window.__demo = {
  seek(id, kind, ms){ react(id, kind); (live[id]||[]).forEach(a => { a.pause(); a.currentTime = ms; }); },
  talk, dogBlink, react, enterFree,
  lids(shut){ document.querySelectorAll("#dog .lid").forEach(l=>l.classList.toggle("shut", shut)); },
  mouth(v){ talk(false); mouth.style.opacity = v>0 ? 1 : 0; mouth.style.transform = `scaleY(${v})`; },
  audio: au, get paused(){ return paused; },
};
})();
</script>
